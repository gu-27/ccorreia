<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team Room · Tax Study Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/tax-study-fall2026/style.css">
<style>
.wrap{max-width:1100px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.stage{padding:max(14px,env(safe-area-inset-top)) clamp(14px,3vw,32px) max(14px,env(safe-area-inset-bottom))}
.me{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;color:#111;border-radius:99px;padding:6px 14px;font-weight:700}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:18px}
.join{background:#fff;color:#111;border-radius:20px;padding:clamp(18px,3vw,32px);display:grid;gap:8px;justify-items:center;text-align:center}
.join .code{font:800 clamp(64px,10vw,120px)/1 "Barlow Condensed",sans-serif;letter-spacing:6px;color:var(--red)}
.join .url{font:700 clamp(15px,2vw,20px) Barlow,sans-serif;word-break:break-all}
.qr svg{width:160px;height:160px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{background:var(--panel);border-radius:99px;padding:8px 14px;font-weight:700}
.person.off{opacity:.45}.person small{color:#ffd166;margin-left:6px}
.person button{background:none;border:0;color:#888;margin-left:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:14px;flex:1}
.side h3{font-size:24px;margin-bottom:8px}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qhead .spacer{flex:1}
.pts{color:#ffd166;font:800 34px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.clock{width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:800 32px "Barlow Condensed",sans-serif;flex:none}
.prompt{font:700 clamp(22px,3.2vw,38px)/1.2 Barlow,sans-serif;text-wrap:balance;margin:14px 0}
.opts .opt{min-height:64px;font-size:clamp(17px,2vw,22px)}
.opt.correct{outline:5px solid #fff;outline-offset:-5px}.opt.dim{opacity:.28}.opt.mine{box-shadow:0 0 0 4px #ffd166 inset}
.opt[disabled]{cursor:default}
.result{border-radius:14px;padding:14px 16px;font-size:19px;margin-top:12px}
.result.ok{background:var(--ok)}.result.no{background:#3a1419;border-left:6px solid var(--red)}
.jboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:#000;padding:6px;border-radius:14px}
.jcat{background:var(--red);color:#fff;font:800 clamp(11px,1.5vw,18px)/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;text-align:center;display:grid;place-items:center;min-height:60px;padding:6px;border-radius:8px;overflow-wrap:anywhere;hyphens:auto}
.jtile{background:#1e1e1e;color:#ffd166;border:0;border-radius:8px;font:800 clamp(18px,3.2vw,38px) "Barlow Condensed",sans-serif;min-height:clamp(48px,7.5vw,80px)}
.jtile:disabled{cursor:default}.jtile.used{color:transparent;background:#141414}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:760px;width:100%;margin:10px auto}
.col{display:flex;flex-direction:column}
.winner{text-align:center;font:800 clamp(20px,3vw,32px) "Barlow Condensed",sans-serif;margin-bottom:6px}
.winner small{display:block;font:600 15px Barlow,sans-serif;color:var(--muted)}
.step{border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:10px;font:800 54px "Barlow Condensed",sans-serif;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both}
.p1{height:200px;background:linear-gradient(#d12a45,#A6192E);animation-delay:1.6s}.p2{height:150px;background:#5a5a5a;animation-delay:.9s}.p3{height:110px;background:#6d1020;animation-delay:.3s}
@keyframes rise{from{transform:scaleY(0)}}
form{display:grid;gap:12px;max-width:420px;width:100%}
@media(max-width:600px){.jcat{font-size:9px;min-height:56px;padding:3px}.jboard{gap:3px;padding:3px}.clock{width:48px;height:48px;font-size:24px}}
@media(max-width:820px){.lobby,.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage">
<div class="wrap">
  <div class="top">
    <a class="brand" href="/games/tax-study-fall2026/" style="color:#fff;text-decoration:none">TAX <b>STUDY</b> HUB</a>
    <span class="chip" id="roomChip"></span>
    <span class="chip hidden" id="conn">Reconnecting…</span>
    <div class="spacer"></div>
    <span class="me hidden" id="me"></span>
    <button class="icon" id="mute" aria-label="Toggle sound">♪</button>
  </div>

  <section id="vName" class="center hidden">
    <h1 style="font-size:52px">Join the room</h1>
    <form id="nameForm" autocomplete="off">
      <input id="nCode" maxlength="5" placeholder="CODE" style="text-transform:uppercase;letter-spacing:6px;text-align:center;font:800 30px 'Barlow Condensed',sans-serif" aria-label="Room code">
      <input id="nName" maxlength="20" placeholder="Your name" aria-label="Your name">
      <button class="btn" type="submit">Join</button>
      <div class="muted" id="nErr" role="alert"></div>
    </form>
  </section>

  <section id="vLobby" class="hidden">
    <div class="lobby">
      <div class="join">
        <div style="color:#555;font-weight:700">Classmates join at</div>
        <div class="url" id="url"></div>
        <div style="color:#555;font-weight:700">with code</div>
        <div class="code" id="code"></div>
        <div class="qr" id="qr"></div>
      </div>
      <div style="display:grid;gap:14px">
        <h2 style="font-size:40px"><span id="nPlayers">0</span> in the room</h2>
        <div class="muted" id="gameName"></div>
        <div class="people" id="people"></div>
        <div id="lobbyCta"></div>
      </div>
    </div>
  </section>

  <section id="vPlay" class="hidden" style="flex:1;display:flex;flex-direction:column">
    <div class="layout">
      <div>
        <div id="boardBox" class="hidden">
          <div class="muted" id="boardMsg" style="margin-bottom:10px"></div>
          <div class="jboard" id="jboard"></div>
          <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap" id="boardCtl"></div>
        </div>
        <div id="qBox" class="hidden">
          <div class="qhead">
            <span class="chip" id="qTag"></span><div class="spacer"></div>
            <span class="pts" id="pts"></span><span class="muted" id="ptsLbl"></span>
            <span class="clock" id="clock"></span>
          </div>
          <div class="timerbar" style="margin-top:10px"><i id="tbar"></i></div>
          <div id="readyBox" class="center hidden" style="min-height:240px"><div class="muted cond" style="font-size:28px">Get ready</div><div class="cond" style="font-size:110px;color:var(--red)" id="readyN">3</div></div>
          <div id="qBody">
            <div class="prompt" id="prompt"></div>
            <div class="opts" id="opts"></div>
            <div class="result hidden" id="result"></div>
          </div>
          <div class="top" style="margin-top:12px"><span class="muted" id="answered"></span><div class="spacer"></div><span id="hostCtl"></span></div>
        </div>
      </div>
      <aside class="side"><h3>Leaderboard</h3><ol class="board" id="lb"></ol></aside>
    </div>
  </section>

  <section id="vEnd" class="hidden" style="flex:1;display:flex;flex-direction:column;gap:16px;padding-top:10px">
    <h1 style="text-align:center;font-size:clamp(38px,6vw,60px)">Final results</h1>
    <div class="podium" id="podium"></div>
    <div style="max-width:640px;margin:0 auto;width:100%"><ol class="board" id="all"></ol></div>
    <div style="text-align:center"><a class="btn" href="/games/tax-study-fall2026/" style="display:inline-block;text-decoration:none">Back to the hub</a></div>
  </section>

  <section id="vGone" class="center hidden"><h1 style="font-size:44px" id="goneMsg"></h1><a class="btn" href="/games/tax-study-fall2026/" style="text-decoration:none">Back to the hub</a></section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/games/tax-study-fall2026/common.js"></script>
<script>
{
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const G = window.Game, esc = G.esc, BASE = "/games/tax-study-fall2026", L = "ABCD";
const GAME_NAMES = { quiz: "Quiz", flash: "Flashcards speed round", jeopardy: "Jeopardy" };
const views = ["vName", "vLobby", "vPlay", "vEnd", "vGone"];
const show = (id) => views.forEach((v) => $("#" + v).classList.toggle("hidden", v !== id));
let code = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
let me = code ? G.store.get("room:" + code) : null;
let sock = null, st = null, lastKey = "", tickId = null, lastSec = null;

$("#mute").onclick = () => { const m = G.music.toggle(); $("#mute").textContent = m ? "🔇" : "♪"; };
$("#mute").textContent = G.music.muted ? "🔇" : "♪";
document.addEventListener("pointerdown", () => G.sfx.unlock(), { once: true });

if (code && me && me.name) connect();
else { show("vName"); $("#nCode").value = code; $("#nName").value = G.store.get("studyName") || ""; }

$("#nameForm").onsubmit = async (e) => {
  e.preventDefault(); G.sfx.unlock();
  const c = $("#nCode").value.trim().toUpperCase(), name = $("#nName").value.trim();
  if (!/^[A-Z0-9]{5}$/.test(c)) return ($("#nErr").textContent = "Room codes are 5 characters.");
  if (!name) return ($("#nErr").textContent = "Add your name.");
  const ok = await fetch(`${BASE}/api/check/${c}`).then((r) => r.json()).then((j) => j.ok).catch(() => false);
  if (!ok) return ($("#nErr").textContent = "No room with that code.");
  code = c; G.store.set("studyName", name);
  me = { ...(G.store.get("room:" + c) || {}), name };
  if (!me.pid) me.pid = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2);
  G.store.set("room:" + c, me);
  history.replaceState(null, "", `${BASE}/room?code=${c}`);
  connect();
};

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const q = new URLSearchParams({ pid: me.pid, name: me.name });
  if (me.hostKey) q.set("host", me.hostKey);
  sock = G.connect(`${proto}://${location.host}${BASE}/ws/${code}?${q}`, onMsg, (ok) => $("#conn").classList.toggle("hidden", ok));
  $("#roomChip").textContent = `Room ${code}`;
}

const send = (o) => sock && sock.send(o);
const isHost = () => st && st.host;

function onMsg(m) {
  if (m.t === "kicked") { sock.close(); $("#goneMsg").textContent = "You were removed from the room"; return show("vGone"); }
  if (m.t !== "state") return;
  st = m;
  if (m.you) { $("#me").textContent = m.you.name + (m.host ? " · host" : ""); $("#me").classList.remove("hidden"); }
  const key = `${m.phase}:${m.qi}:${m.q ? m.q.prompt : ""}`, isNew = key !== lastKey;
  if (m.phase === "lobby") lobby(m);
  else if (m.phase === "board") board(m, isNew);
  else if (m.phase === "question" || m.phase === "reveal") question(m, isNew);
  else if (m.phase === "end") end(m, isNew);
  leaderboard(m);
  lastKey = key;
}

function leaderboard(m) {
  $("#lb").innerHTML = m.board.slice(0, 8).map((p) => `<li${m.you && p.id === m.you.id ? ' style="outline:2px solid #ffd166"' : ""}><span class="r">${p.rank}</span>${esc(p.name)}<span class="s">${p.points.toLocaleString()}</span></li>`).join("");
}

function lobby(m) {
  show("vLobby");
  if (m.host) G.music.play("lobby");
  $("#code").textContent = m.code;
  const link = `${location.host}${BASE}/room?code=${m.code}`;
  $("#url").textContent = `${location.host}${BASE}`;
  if (!$("#qr").dataset.done) {
    try { const q = qrcode(0, "M"); q.addData(`${location.origin}${BASE}/room?code=${m.code}`); q.make(); $("#qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); $("#qr").dataset.done = 1; } catch {}
  }
  $("#gameName").textContent = `Game: ${GAME_NAMES[m.game]}${m.total ? ` · ${m.total} questions` : ""}. Host: ${m.hostName || "…"}`;
  $("#nPlayers").textContent = m.players.length;
  $("#people").innerHTML = m.players.map((p) => `<span class="person${p.online ? "" : " off"}">${esc(p.name)}${p.host ? "<small>host</small>" : ""}${m.host && !p.host ? `<button data-kick="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">✕</button>` : ""}</span>`).join("");
  $("#lobbyCta").innerHTML = m.host
    ? `<button class="btn" id="startBtn" style="font-size:28px;padding:14px 36px">Start game</button><div class="note muted" style="margin-top:8px">Share the code or the link. You can start anytime, even alone.</div>`
    : `<div class="muted" style="font-size:20px">Waiting for ${esc(m.hostName || "the host")} to start…</div>`;
  const sb = $("#startBtn"); if (sb) sb.onclick = () => send({ t: "start" });
}
$("#people").onclick = (e) => { const b = e.target.closest("[data-kick]"); if (b) send({ t: "kick", pid: b.dataset.kick }); };

function board(m, isNew) {
  show("vPlay"); clearInterval(tickId);
  $("#boardBox").classList.remove("hidden"); $("#qBox").classList.add("hidden");
  if (isNew && m.host) G.music.play("lobby");
  const jb = m.jb, used = new Set(jb.used);
  $("#boardMsg").textContent = m.host ? "Your pick. Everyone answers on their own device, and the fastest correct answer wins the tile." : `${m.hostName || "The host"} is picking a clue…`;
  $("#jboard").innerHTML = jb.cats.map((c) => `<div class="jcat">${esc(c.name)}</div>`).join("") +
    [0, 1, 2, 3, 4].map((r) => jb.cats.map((c, ci) => { const k = `${ci}-${r}`; return `<button class="jtile${used.has(k) ? " used" : ""}" data-c="${ci}" data-r="${r}" ${!m.host || used.has(k) ? "disabled" : ""}>$${c.values[r] ?? ""}</button>`; }).join("")).join("");
  const allUsed = used.size >= jb.cats.reduce((a, c) => a + c.values.length, 0);
  $("#boardCtl").innerHTML = m.host
    ? `${jb.hasFinal ? `<button class="btn${allUsed ? "" : " ghost"}" id="finalBtn">Final Jeopardy</button>` : ""}<button class="btn ghost" id="endBtn">End game</button>`
    : "";
  const fb = $("#finalBtn"); if (fb) fb.onclick = () => send({ t: "final" });
  armEnd();
}
$("#jboard").onclick = (e) => { const b = e.target.closest(".jtile"); if (b && !b.disabled && isHost()) send({ t: "pick", c: +b.dataset.c, r: +b.dataset.r }); };

function armEnd() {
  const b = $("#endBtn"); if (!b) return;
  b.onclick = () => { if (b.dataset.armed) send({ t: "end" }); else { b.dataset.armed = 1; b.textContent = "Tap again to end"; setTimeout(() => { delete b.dataset.armed; b.textContent = "End game"; }, 3000); } };
}

function question(m, isNew) {
  show("vPlay");
  $("#boardBox").classList.add("hidden"); $("#qBox").classList.remove("hidden");
  const q = m.q, rev = m.reveal, mine = m.you ? m.you.answered : null;
  const countdown = m.game === "quiz";
  $("#qTag").textContent = m.game === "jeopardy" ? (q.final ? "Final Jeopardy" : `${q.tag} · $${q.value}`) : `${m.qi + 1}/${m.total} · ${q.tag}`;
  $("#ptsLbl").textContent = countdown ? "pts" : "";
  $("#answered").textContent = `${m.answered}/${m.players.filter((p) => p.online).length || m.players.length} answered`;
  if (isNew) {
    $("#prompt").textContent = q.kind === "lie" ? "Which one is the lie?" : q.prompt;
    $("#opts").style.gridTemplateColumns = q.kind === "lie" || m.game === "jeopardy" ? "1fr" : "";
  }
  // Options: re-render when the state of my answer or the reveal changes.
  const max = rev ? Math.max(1, ...rev.dist) : 1;
  $("#opts").innerHTML = q.options.map((o, i) => {
    const cls = [`opt o${i}`, rev && i === rev.answer ? "correct" : "", rev && i !== rev.answer ? "dim" : "", mine === i ? "mine" : ""].join(" ");
    return `<button class="${cls}" data-i="${i}" ${mine != null || rev ? "disabled" : ""}><span class="k">${L[i]}</span><span>${esc(o)}</span>${rev ? `<span class="n">${rev.dist[i]}</span><i class="bar" style="width:${(rev.dist[i] / max) * 100}%"></i>` : ""}</button>`;
  }).join("");
  $("#hostCtl").innerHTML = m.host
    ? rev ? `<button class="btn" id="nextBtn">${m.game === "jeopardy" ? (q.final ? "Final results" : "Back to board") : m.qi + 1 >= m.total ? "Final results" : "Next question"}</button>`
          : `<button class="btn ghost" id="endBtn">End game</button> <button class="btn" id="revealBtn">Reveal answer</button>`
    : "";
  const nb = $("#nextBtn"); if (nb) nb.onclick = () => send({ t: "next" });
  const rb = $("#revealBtn"); if (rb) rb.onclick = () => send({ t: "reveal" });
  armEnd();

  if (rev) {
    clearInterval(tickId); tickId = null;
    $("#readyBox").classList.add("hidden"); $("#qBody").classList.remove("hidden");
    $("#clock").textContent = "✓"; $("#tbar").style.transform = "scaleX(0)";
    $("#pts").textContent = "";
    const y = m.you || {};
    let msg;
    if (y.right) msg = y.last ? `<b>Correct! +${y.last.toLocaleString()}</b>` : `<b>Correct</b>, but ${esc(rev.winner || "someone")} was faster.`;
    else msg = `<b>${mine == null ? "Time's up." : "Not quite."}</b> Answer: ${L[rev.answer]}. ${esc(q.options[rev.answer])}.`;
    if (m.game !== "quiz" && !q.final && rev.winner && !y.won) msg += ` ${esc(rev.winner)} took it.`;
    $("#result").className = "result " + (y.right ? "ok" : "no");
    $("#result").innerHTML = `${msg} <span style="opacity:.9">${esc(rev.why)}</span>`;
    if (isNew) { G.music.stop(); y.right ? G.sfx.right() : G.sfx.wrong(); }
    return;
  }
  $("#result").className = "result hidden";
  if (!isNew) return;
  if (m.host) G.music.play("question");
  clearInterval(tickId); lastSec = null;
  const tick = () => {
    const now = G.now(), ready = now < m.qStart;
    $("#readyBox").classList.toggle("hidden", !ready); $("#qBody").classList.toggle("hidden", ready);
    if (ready) { $("#readyN").textContent = Math.ceil((m.qStart - now) / 1000); $("#pts").textContent = countdown ? 1000 : (q.final ? "1,000 each" : `$${q.value || 1000}`); return; }
    const left = Math.max(0, m.deadline - now), sec = Math.ceil(left / 1000), frac = left / (m.deadline - m.qStart);
    $("#clock").textContent = sec;
    $("#tbar").style.transform = `scaleX(${frac})`;
    $("#pts").textContent = countdown ? Math.round(1000 * frac) : (q.final ? "1,000 each" : m.game === "jeopardy" ? `$${q.value}` : "1,000 to fastest");
    if (m.host && sec !== lastSec && sec <= 5 && sec > 0) G.sfx.tick(sec <= 3);
    lastSec = sec;
  };
  tick(); tickId = setInterval(tick, 100);
}
$("#opts").onclick = (e) => {
  const b = e.target.closest("[data-i]"); if (!b || b.disabled || !st || st.phase !== "question") return;
  G.sfx.click(); if (navigator.vibrate) try { navigator.vibrate(25); } catch {}
  $$("#opts .opt").forEach((x) => x.disabled = true); b.classList.add("mine");
  send({ t: "answer", i: Number(b.dataset.i) });
};

function end(m, isNew) {
  show("vEnd"); clearInterval(tickId);
  if (!isNew) return;
  G.music.stop();
  const b = m.board;
  const slot = (p, n) => p ? `<div class="col"><div class="winner">${esc(p.name)}<small>${p.points.toLocaleString()} pts · ${p.correct} correct</small></div><div class="step p${n}">${n}</div></div>` : '<div class="col"></div>';
  $("#podium").innerHTML = slot(b[1], 2) + slot(b[0], 1) + slot(b[2], 3);
  $("#all").innerHTML = b.map((p) => `<li${m.you && p.id === m.you.id ? ' style="outline:2px solid #ffd166"' : ""}><span class="r">${p.rank}</span>${esc(p.name)}<span class="s">${p.points.toLocaleString()}</span></li>`).join("");
  G.sfx.fanfare(); setTimeout(() => G.confetti(5000), 1800);
}
}
</script>
</body>
</html>
